---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - monitor.storage-spaces.monitor.com
  resources:
  - storagespacemonitors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitor.storage-spaces.monitor.com
  resources:
  - storagespacemonitors/finalizers
  verbs:
  - update
- apiGroups:
  - monitor.storage-spaces.monitor.com
  resources:
  - storagespacemonitors/status
  verbs:
  - get
  - patch
  - update
